modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

# Array entry: a JAR may declare one or more mods.
[[mods]]
modId = "pp_legendarydungeons"
version = "${version}"
displayName = "Cobblemon: Explore Legendary Dungeons"
logoFile = "icon.png"
authors = "Professor Porker"
description = """
A Cobblemon side mod that adds legendary dungeon content, structures, and related gameplay systems.
"""

# Single table for the feature requirements of this mod.
# NeoForge 21.1.214 / FML loader 4.0.42 rejects this as [[features...]].
[features.pp_legendarydungeons]
javaVersion = "[21,)"

# Array entry: a mod may declare one or more mixin configurations.
[[mixins]]
config = "pp_legendarydungeons.mixins.json"

# Array entries: each required mod is a separate dependency object.
[[dependencies.pp_legendarydungeons]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.pp_legendarydungeons]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.214,21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.pp_legendarydungeons]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,14)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.pp_legendarydungeons]]
modId = "cobblemon"
type = "required"
versionRange = "[1.7.3,1.8.0]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.pp_legendarydungeons]]
modId = "mega_showdown"
type = "required"
versionRange = "[1.6.7,)"
ordering = "AFTER"
side = "BOTH"
